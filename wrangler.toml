name = "axon"
main = "src/index.ts"
compatibility_date = "2026-10-19"
workers_dev = true

routes = [
  { pattern = "axon.va-n.com", custom_domain = true }
]

[[rules]]
type = "CompiledWasm"
globs = ["**/*.wasm"]
fallthrough = false

# Workers Rate Limiting API: per-colo, atomic, available on the free plan.
# 30 requests per 60 seconds per IP hash. The in-isolate bucket in src/limits.ts
# is a second, cheaper layer for tight bursts.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[observability]
enabled = true
head_sampling_rate = 1
